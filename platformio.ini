; Daily Fish: a new procedurally generated fish every day on the
; Seeed Studio XIAO 7.5" ePaper Panel (XIAO ESP32-C3, 800x480, UC8179).

[platformio]
default_envs = panel

[env]
platform = espressif32@^6.12.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/version.py
lib_deps =
    zinggjm/GxEPD2@^1.6.0
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0

; The firmware that lives on the panel: draw once a day, deep sleep between.
[env:panel]

; For working on it at a desk: never sleeps (so the USB port stays up for
; uploads), prints timings, sends each frame to tools/bench/capture.py, and
; takes commands over serial. See the README.
[env:bench]
build_flags =
    ${env.build_flags}
    -DBENCH_MODE=1
    -Wno-unused-function
    -Wno-unused-variable
